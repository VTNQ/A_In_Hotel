<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password OTP</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f9;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f9;padding:40px 0;">
  <tr>
    <td align="center">

      ```
      <table width="600" cellpadding="0" cellspacing="0"
             style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.08);">

        <!-- Header -->
        <tr>
          <td align="center"
              style="background:#0f172a;padding:30px;color:#ffffff;">
            <h1 style="margin:0;font-size:28px;">
              Reset Password
            </h1>
          </td>
        </tr>

        <!-- Content -->
        <tr>
          <td style="padding:40px 35px;color:#334155;">

            <p style="font-size:16px;line-height:1.7;margin-top:0;">
              Hello,
            </p>

            <p style="font-size:16px;line-height:1.7;">
              We received a request to reset your password.
              Please use the OTP code below to continue:
            </p>

            <!-- OTP Box -->
            <div style="text-align:center;margin:35px 0;">
              <div style="
                            display:inline-block;
                            background:#f1f5f9;
                            border:2px dashed #2563eb;
                            border-radius:12px;
                            padding:20px 40px;
                            font-size:36px;
                            font-weight:bold;
                            letter-spacing:8px;
                            color:#2563eb;
                        ">
                [[${otp}]]
              </div>
            </div>

            <p style="font-size:15px;line-height:1.7;">
              This OTP will expire in
              <strong>5 minutes</strong>.
            </p>

            <p style="font-size:15px;line-height:1.7;">
              If you did not request a password reset,
              please ignore this email.
            </p>

            <hr style="border:none;border-top:1px solid #e2e8f0;margin:30px 0;">

            <p style="font-size:13px;color:#94a3b8;text-align:center;">
              © 2026 A-In Hotel. All rights reserved.
            </p>

          </td>
        </tr>

      </table>

    </td>
  </tr>

</table>

</body>
</html>
